spring.application.name=publicolor-backend

# Carga un .env local si existe (no se versiona)
spring.config.import=optional:file:.env[.properties]

# -- Base de datos (PostgreSQL 18 local, instalado como servicio de Windows) --
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/publicolor}
spring.datasource.username=${DB_USERNAME:publicolor}
spring.datasource.password=${DB_PASSWORD:publicolor_dev}
spring.datasource.driver-class-name=org.postgresql.Driver

# -- JPA (el esquema lo controla Flyway, nunca Hibernate) --------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# -- Flyway -------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration

# -- Jackson (los montos NUMERIC/BigDecimal nunca se serializan en notacion cientifica) --
spring.jackson.generator.write-bigdecimal-as-plain=true

# -- JWT ------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:publicolor-dev-secret-cambiar-en-produccion-0123456789abcdef}
jwt.expiration-ms=${JWT_EXPIRATION_MS:43200000}

# -- Servidor -------------------------------------------------------------------
server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# -- Frontend / CORS --------------------------------------------------------------
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# -- Admin inicial (solo se usa una vez si la tabla users está vacía) --------------
admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@publicolor.com}
admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@2026Publi.color}
